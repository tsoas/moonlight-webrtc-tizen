<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moonlight WebRTC Test</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }

    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
      letter-spacing: 0;
    }

    #status {
      margin: 0 0 20px;
      font-weight: 600;
    }

    #log {
      min-height: 220px;
      margin: 0 0 20px;
      padding: 12px;
      overflow: auto;
      border: 1px solid currentColor;
      border-radius: 4px;
      font: 13px/1.5 ui-monospace, monospace;
      white-space: pre-wrap;
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
    }
  </style>
</head>
<body>
  <h1>Moonlight WebRTC Test</h1>
  <p id="status">Connection state: new</p>
  <pre id="log" aria-live="polite"></pre>
  <video id="video" autoplay playsinline></video>
  <script src="app.js"></script>
</body>
</html>
