<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moonlight WebRTC Test</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #diagnostics {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 620px;
      max-width: calc(100vw - 48px);
      max-height: calc(100vh - 48px);
      padding: 18px 20px;
      overflow: hidden;
      border-left: 5px solid #45d483;
      background: rgba(0, 0, 0, 0.78);
    }

    #diagnostics.has-error {
      border-left-color: #ff5252;
    }

    #states {
      display: flex;
      gap: 28px;
      margin-bottom: 14px;
      font-size: 22px;
      font-weight: 700;
    }

    dl {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 24px;
      margin: 0 0 16px;
    }

    dl div {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.24);
    }

    dt,
    dd {
      margin: 0;
      font-size: 17px;
    }

    dd {
      font-family: monospace;
      font-weight: 700;
    }

    #log {
      height: 190px;
      margin: 0;
      overflow-y: auto;
      color: #e8e8e8;
      font: 16px/1.4 monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>

  <section id="diagnostics" aria-label="WebRTC diagnostics">
    <div id="states">
      <span>Connection: <strong id="connection-state">new</strong></span>
      <span>ICE: <strong id="ice-state">new</strong></span>
    </div>

    <dl>
      <div><dt>Frames received</dt><dd id="frames-received">0</dd></div>
      <div><dt>Frames decoded</dt><dd id="frames-decoded">0</dd></div>
      <div><dt>Frames dropped</dt><dd id="frames-dropped">0</dd></div>
      <div><dt>Packets received</dt><dd id="packets-received">0</dd></div>
      <div><dt>Packets lost</dt><dd id="packets-lost">0</dd></div>
      <div><dt>Bytes received</dt><dd id="bytes-received">0</dd></div>
    </dl>

    <pre id="log" aria-live="assertive"></pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
